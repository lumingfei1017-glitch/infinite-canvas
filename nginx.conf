server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 网关（ComfyUI + 百炼）由 compose 里的 comfy-gateway 容器提供，浏览器同源访问 /api/comfy/* 与 /api/bailian/*。
    # 用变量转发，网关容器未启动时 nginx 仍能正常起来，仅该路径返回 502。
    location /api/comfy/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $comfy_gateway http://comfy-gateway:8787;
        proxy_pass $comfy_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 600m;
    }

    location /api/bailian/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $comfy_gateway http://comfy-gateway:8787;
        proxy_pass $comfy_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 600m;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
